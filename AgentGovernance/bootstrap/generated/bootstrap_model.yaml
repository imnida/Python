meta:
  name: bootstrap-model
  version: '2.0'
  archimate: '3.2'
  description: Self-describing ArchiMate model
  generated_by: ModelBootstrapper
  note: "Generated \u2014 do not edit manually"
motivation:
  stakeholders:
  - name: ArchitectureTeam
    description: Authors guardrails and operates the governance harness
    concerns:
    - Policy correctness
    - Auditability
    - Agent safety
    influences: []
  - name: AuditCommittee
    description: Reviews AGT audit logs and compliance evidence
    concerns:
    - Tamper evidence
    - Traceability
    - Regulatory compliance
    influences: []
  - name: AIAgentOperator
    description: Deploys and monitors AI agents in production
    concerns:
    - Agent reliability
    - Policy transparency
    - Fail-safe behaviour
    influences: []
  drivers:
  - id: D1
    name: AI agent proliferation
    description: Autonomous agents operating without governance create unacceptable
      operational risk
    category: external
    associated_to:
    - ArchitectureTeam
    - AuditCommittee
  - id: D2
    name: Architectural drift
    description: ArchiMate models diverge from reality without continuous automated
      sync
    category: internal
    associated_to:
    - ArchitectureTeam
  - id: D3
    name: Audit gap
    description: Manual policy enforcement leaves no tamper-evident trail for compliance
    category: internal
    associated_to:
    - AuditCommittee
  assessments:
  - id: A1
    name: Unauthorized write risk
    description: An AI agent bypasses ArchiMate write controls and corrupts the model
    type: risk
    associated_to:
    - D1
  - id: A2
    name: Guardrail bypass risk
    description: An agent calls a forbidden tool after archguard rules are circumvented
    type: risk
    associated_to:
    - D1
  - id: A3
    name: Audit gap risk
    description: A violation occurs but is not recorded due to missing audit logging
    type: risk
    associated_to:
    - D3
  - id: A4
    name: Governance automation opportunity
    description: Boucle 0 pipeline enables deterministic policy derivation from ArchiMate
    type: opportunity
    associated_to:
    - D2
  goals:
  - id: G1
    name: FailSafeGovernance
    description: Every AI agent action is governed by an active, verified policy;
      errors deny
    realized_by:
    - P3
    - GovernanceEnforcement
  - id: G2
    name: TraceableDecisions
    description: Every grounding decision and policy rule is recorded and auditable
    realized_by:
    - P8
    - P9
    - AuditService
  - id: G3
    name: ContinuousCompliance
    description: Guardrails are continuously refined from violation feedback without
      human bottleneck
    realized_by:
    - R1
    - FeedbackCycle
  outcomes: []
  values: []
  meanings: []
  principles:
  - id: P1
    severity: must
    text: archguard is the sole authority for rules
  - id: P2
    severity: must
    text: ArchiMate is the sole authority for the model
  - id: P3
    severity: must
    text: "Fail-closed \u2014 errors result in deny"
  - id: P4
    severity: must
    text: No component writes rules directly to AGT
  - id: P5
    severity: must
    text: FeedbackProcessor writes to archguard only
  - id: P6
    severity: must
    text: AI agents cannot access archguard
  - id: P7
    severity: must
    text: AI agents cannot access ArchiMate model
  - id: P8
    severity: must
    text: GroundingAuditLog is append-only
  - id: P9
    severity: must
    text: AGTAuditLog is append-only
  - id: P10
    severity: must
    text: ToolRegistry is read-only at runtime
  constraints:
  - id: C1
    severity: must
    text: GroundingEngine must not write to archguard
  - id: C2
    severity: must
    text: FeedbackProcessor must not write to AGTPolicyDocument
  - id: C3
    severity: must
    text: AGT must not write to ToolRegistry
  requirements:
  - id: R1
    severity: should
    text: Policy reload after every guardrail update
  - id: R2
    severity: should
    text: Human approval required before model changes
  - id: R3
    severity: may
    text: All grounding decisions must be traceable
strategy:
  resources: []
  capabilities:
  - name: GovernanceEnforcement
    description: Enforce architectural constraints on AI agents at runtime via AGT
      policy
    realizes:
    - G1
    served_by: []
  - name: GuardrailManagement
    description: Maintain, search, and lifecycle-manage architectural guardrails in
      archguard
    realizes:
    - G1
    - G3
    served_by: []
  - name: PolicyDerivation
    description: Automatically derive executable AGT policy from ArchiMate model via
      Boucle 0
    realizes:
    - G1
    - G2
    served_by: []
  - name: FeedbackCycle
    description: Refine guardrails continuously from AGT violation evidence
    realizes:
    - G3
    served_by: []
  - name: AgentIdentity
    description: Issue and verify cryptographic identities for agents (Ed25519 / ML-DSA-65)
    realizes:
    - G1
    served_by: []
  value_streams:
  - name: GovernanceCycle
    description: End-to-end cycle from model declaration to policy enforcement and
      refinement
    stages:
    - Model
    - Bootstrap
    - Activate
    - Enforce
    - Feedback
    realizes:
    - GovernanceEnforcement
    - FeedbackCycle
  courses_of_action:
  - name: Boucle0Strategy
    description: Run Boucle 0 pipeline to derive policy from ArchiMate before agent
      launch
    realizes:
    - PolicyDerivation
  - name: FailClosedStrategy
    description: 'Default-deny policy: only explicitly allowed tool calls succeed'
    realizes:
    - GovernanceEnforcement
layers:
- name: Business
  elements:
  - name: ArchitectureTeam
    type: BusinessActor
    description: Team that authors components.py, runs Boucle 0, and activates guardrails
    plays:
    - PolicyReviewer
    - GuardrailAuthor
  - name: AuditCommittee
    type: BusinessActor
    description: Reviews compliance evidence from AGT audit logs
    plays:
    - SecurityAuditor
  - name: PolicyReviewer
    type: BusinessRole
    description: Reviews and approves guardrails at the Boucle 0 human gate
    assigned_to:
    - GroundingEngine
  - name: GuardrailAuthor
    type: BusinessRole
    description: Authors motivation elements in components_*.py files
    assigned_to:
    - archguard
  - name: SecurityAuditor
    type: BusinessRole
    description: Reads AGT audit logs and validates compliance evidence
    assigned_to:
    - AgentSRE
  - name: BootstrapProcess
    type: BusinessProcess
    description: Runs Boucle 0 pipeline to derive AGT policy from ArchiMate model
    triggers:
    - PolicyActivated
    realizes:
    - GovernanceService
    assigned_to:
    - PolicyReviewer
  - name: ViolationHandling
    type: BusinessProcess
    description: Reviews AGT violation alerts and decides remediation action
    triggered_by:
    - ViolationRaised
    realizes:
    - ComplianceService
    accesses:
    - ComplianceReport
    assigned_to:
    - SecurityAuditor
  - name: GuardrailRefinement
    type: BusinessProcess
    description: Evaluates RefinementProposals from FeedbackProcessor and promotes
      to active
    realizes:
    - GovernanceService
    assigned_to:
    - GuardrailAuthor
  - name: PolicyActivated
    type: BusinessEvent
    description: A new AGT policy version becomes active
    triggers:
    - BootstrapProcess
  - name: ViolationRaised
    type: BusinessEvent
    description: AGT raises an alert for a denied agent call
    triggers:
    - ViolationHandling
  - name: GuardrailProposed
    type: BusinessEvent
    description: FeedbackProcessor proposes a guardrail refinement
    triggers: []
  - name: GovernanceService
    type: BusinessService
    description: Provides runtime enforcement of architectural constraints for AI
      agents
    serves: []
  - name: ComplianceService
    type: BusinessService
    description: Provides evidence of policy compliance to audit stakeholders
    serves: []
  - name: AuditService
    type: BusinessService
    description: Delivers tamper-evident audit logs for all agent actions
    serves: []
  - name: GovernanceMandate
    type: BusinessObject
    description: Organisational directive requiring AI agent governance
  - name: ComplianceReport
    type: BusinessObject
    description: Periodic summary of AGT violations, deny rates, and trend analysis
- name: Application
  elements:
  - name: ArchiServer
    type: ApplicationComponent
    description: Exposes ArchiMate model via REST API (read-only)
    functions:
    - ModelExposure
    - ElementQuery
    - RelationshipQuery
  - name: archguard
    type: ApplicationComponent
    description: Queryable store of architectural constraints and guardrails
    functions:
    - GuardrailManagement
    - HybridSearch
    - LifecycleManagement
  - name: GroundingEngine
    type: ApplicationComponent
    description: Translates semantic guardrails to operational AGT policies
    functions:
    - SemanticParser
    - ToolResolver
    - PolicyGenerator
    - GroundingAuditor
  - name: AGT
    type: ApplicationComponent
    description: Runtime policy enforcement for AI agents
    functions:
    - PolicyEvaluator
    - AuditLogger
    - Enforcer
  - name: AgentMesh
    type: ApplicationComponent
    description: Cryptographic identity and trust scoring for agents
    functions:
    - IdentityManager
    - TrustScorer
    - CredentialVerifier
  - name: AgentSRE
    type: ApplicationComponent
    description: Observability, SLOs and circuit breakers for agent fleets
    functions:
    - SLOMonitor
    - CircuitBreaker
    - ReplayDebugger
  - name: FeedbackProcessor
    type: ApplicationComponent
    description: Ingests AGT violations and refines archguard rules
    functions:
    - ViolationIngestion
    - PatternAnalyzer
    - RuleRefiner
    - ModelUpdateTrigger
  - name: ArchiMateWriter
    type: ApplicationComponent
    description: Human-gated write-back endpoint to the Archi model via REST API
    functions:
    - ElementUpsert
    - RelationshipUpsert
    - ModelImport
    - HumanApprovalGate
  - name: ArchiMateGeneratorAgent
    type: ApplicationComponent
    description: Hybrid rule+LLM agent that generates and pushes ArchiMate models
    functions:
    - StructuralInference
    - SemanticEnrichment
    - ModelPush
  - name: archguardCLI
    type: ApplicationInterface
    description: Command-line interface to archguard guardrail store
    protocol: CLI
    serves:
    - GuardrailQueryService
    part_of: archguard
  - name: ArchiServerREST
    type: ApplicationInterface
    description: HTTP REST API exposing the ArchiMate model at localhost:8765
    protocol: REST
    serves:
    - ModelQueryService
    part_of: ArchiServer
  - name: AGTPolicyLoader
    type: ApplicationInterface
    description: YAML file interface for loading policy into AGT
    protocol: YAML
    serves:
    - PolicyEvaluationService
    part_of: AGT
  - name: FeedbackWebhook
    type: ApplicationInterface
    description: Event-driven interface for receiving AGT violation events
    protocol: Event
    serves:
    - ViolationIngestionService
    part_of: FeedbackProcessor
  - name: Boucle0Pipeline
    type: ApplicationProcess
    description: "6-step deterministic pipeline: model \u2192 guardrails \u2192 policy\
      \ \u2192 AGT"
    steps:
    - etape0
    - etape1
    - etape2
    - etape3
    - etape4
    - etape5
    - etape6
    realizes:
    - GroundingService
  - name: GuardrailQueryService
    type: ApplicationService
    description: Hybrid BM25 + semantic search over guardrail corpus
    serves:
    - BootstrapProcess
    realized_by:
    - archguard
  - name: ModelQueryService
    type: ApplicationService
    description: Read-only ArchiMate model query (elements, relations, views)
    serves:
    - BootstrapProcess
    realized_by:
    - ArchiServer
  - name: PolicyEvaluationService
    type: ApplicationService
    description: Evaluates tool_call actions against active deny rules
    serves:
    - ViolationHandling
    realized_by:
    - AGT
  - name: ViolationIngestionService
    type: ApplicationService
    description: Receives and stores AGT violation events for pattern analysis
    realized_by:
    - FeedbackProcessor
  - name: GroundingService
    type: ApplicationService
    description: Maps semantic guardrail text to concrete tool deny lists
    serves:
    - BootstrapProcess
    realized_by:
    - GroundingEngine
  - name: ArchiMateModel
    type: DataObject
    description: Enterprise architecture model (XML/Archi)
  - name: GuardrailCorpus
    type: DataObject
    description: Guardrail store (JSONL + SQLite FTS5)
  - name: ToolRegistry
    type: DataObject
    description: "Semantic concept \u2192 tool names catalog"
  - name: AGTPolicyDocument
    type: DataObject
    description: Executable AGT policy (YAML)
  - name: AGTAuditLog
    type: DataObject
    description: Tamper-evident Merkle-chained audit log
  - name: GroundingAuditLog
    type: DataObject
    description: "Grounding trace: guardrail \u2192 tool names"
  - name: AgentCredential
    type: DataObject
    description: Ed25519 / ML-DSA-65 agent identity
  - name: TrustScore
    type: DataObject
    description: "Behavioural trust score (0\u20131000)"
  - name: RefinementProposal
    type: DataObject
    description: Proposed archguard update from violations
- name: Technology
  elements:
  - name: DeveloperMachine
    type: Node
    description: Local workstation running the governance harness
    hosts:
    - Python3Runtime
    - SQLite3
    - ArchiApplication
  - name: CIEnvironment
    type: Node
    description: CI/CD environment running automated Boucle 0 and policy validation
  - name: Python3Runtime
    type: SystemSoftware
    description: Python 3.11+ runtime for all harness components
    part_of: DeveloperMachine
    serves:
    - archguard
    - GroundingEngine
    - AGT
    - FeedbackProcessor
  - name: SQLite3
    type: SystemSoftware
    description: Embedded database backing archguard's FTS5 guardrail index
    part_of: DeveloperMachine
    serves:
    - archguard
  - name: ArchiApplication
    type: SystemSoftware
    description: Archi EA modelling tool with jArchi plugin hosting archi-server
    part_of: DeveloperMachine
    serves:
    - ArchiServer
    - ArchiMateWriter
  - name: LocalhostHTTP
    type: TechnologyInterface
    description: HTTP interface for archi-server REST API
    protocol: HTTP
    port: 8765
    serves:
    - ModelQueryService
    part_of: DeveloperMachine
  - name: FileSystemService
    type: TechnologyService
    description: Persistent file storage for YAML models and policy files
    serves:
    - GroundingEngine
    - AGT
    realized_by:
    - DeveloperMachine
  - name: bootstrap_model_yaml
    type: Artifact
    description: Generated ArchiMate YAML model
    artifact_type: yaml
  - name: harness_policy_yaml
    type: Artifact
    description: Generated AGT policy YAML
    artifact_type: yaml
  - name: guardrail_corpus_jsonl
    type: Artifact
    description: archguard guardrail store
    artifact_type: json
  - name: toolregistry_yaml
    type: Artifact
    description: "Tool registry keyword\u2192tool mapping"
    artifact_type: yaml
  - name: audit_log_jsonl
    type: Artifact
    description: AGT tamper-evident audit log
    artifact_type: json
- name: Implementation
  elements:
  - name: Boucle0Execution
    type: WorkPackage
    description: Run of the Boucle 0 pipeline producing model + guardrails + policy
    realizes:
    - BootstrapModel
    - AGTPolicy
    - ActiveGuardrailSet
  - name: BootstrapModel
    type: Deliverable
    description: "bootstrap_model.yaml \u2014 ArchiMate YAML model generated by Boucle\
      \ 0"
  - name: AGTPolicy
    type: Deliverable
    description: "harness_policy.yaml \u2014 AGT deny-rule policy derived from guardrails"
  - name: ActiveGuardrailSet
    type: Deliverable
    description: Set of archguard guardrails in 'active' status
  - name: UngovernedState
    type: Plateau
    description: AI agents operating without any runtime policy enforcement
  - name: FullyGovernedState
    type: Plateau
    description: All agents governed by active archguard-derived AGT policy with audit
      trail
    realized_by:
    - GovernanceEnforcement
  - name: GovernanceGap
    type: Gap
    description: Delta between ungoverned and fully governed agent operation
    from_plateau: UngovernedState
    to_plateau: FullyGovernedState
