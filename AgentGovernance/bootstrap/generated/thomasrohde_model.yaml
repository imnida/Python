meta:
  name: bootstrap-model
  version: '2.0'
  archimate: '3.2'
  description: Self-describing ArchiMate model
  generated_by: ModelBootstrapper
  note: "Generated \u2014 do not edit manually"
motivation:
  stakeholders:
  - name: EnterpriseArchitectUser
    description: Primary human using the toolset to model and govern architecture
    concerns:
    - Model accuracy
    - Tool interoperability
    - AI safety
    influences: []
  - name: AIAgentOperator
    description: Developer deploying AI agents against the ecosystem
    concerns:
    - API stability
    - Dry-run safety
    - Idempotency
    influences: []
  - name: PlatformAdministrator
    description: Maintains archi-server, archguard corpus, workflow definitions
    concerns:
    - Service availability
    - Data integrity
    - Access control
    influences: []
  drivers:
  - id: TRD1
    name: Model automation demand
    description: Architects need AI-driven automation that safely writes to the ArchiMate
      model
    category: external
    associated_to:
    - EnterpriseArchitectUser
    - AIAgentOperator
  - id: TRD2
    name: Governance corpus management
    description: Growing guardrail corpus requires structured lifecycle management
      beyond flat files
    category: internal
    associated_to:
    - PlatformAdministrator
  - id: TRD3
    name: Human-in-the-loop requirement
    description: AI agent gate reviews must involve human approval, not automated
      bypass
    category: external
    associated_to:
    - AIAgentOperator
  assessments:
  - id: TRA1
    name: Direct model write risk
    description: AI agent bypasses archi-server and corrupts the .archimate file directly
    type: risk
    associated_to:
    - TRD1
  - id: TRA2
    name: Gate bypass risk
    description: checkpointflow await_event steps auto-approved without human review
    type: risk
    associated_to:
    - TRD3
  - id: TRA3
    name: Idempotency gap opportunity
    description: Using idempotencyKey prevents duplicate elements from parallel agent
      runs
    type: opportunity
    associated_to:
    - TRD1
  goals:
  - id: TRG1
    name: SafeModelAutomation
    description: AI agents write to the ArchiMate model only via archi-server with
      idempotency
    realized_by:
    - TR-P1
    - TR-C1
    - ModelWriteCapability
  - id: TRG2
    name: HumanInLoopGovernance
    description: Every gate review involves a human decision via checkpointflow await_event
    realized_by:
    - TR-P3
    - TR-C3
    - WorkflowGovernanceCapability
  - id: TRG3
    name: EvidenceBasedQuality
    description: Architecture review scores are grounded in cited evidence, not AI
      impressions
    realized_by:
    - TR-P4
    - TR-C4
    - EvidenceCapability
  outcomes: []
  values: []
  meanings: []
  principles:
  - id: TR-P1
    severity: must
    text: archi-server is the sole programmatic write interface to the ArchiMate model
  - id: TR-P2
    severity: must
    text: archguard is the sole authority for architectural guardrails at runtime
  - id: TR-P3
    severity: must
    text: ADM gate reviews must be implemented as checkpointflow await_event steps
  - id: TR-P4
    severity: must
    text: Architecture artifact reviews must be evidence-based using EAROS rubrics
  - id: TR-P5
    severity: must
    text: All workflow state must be persisted to enable deterministic resume
  - id: TR-P6
    severity: should
    text: AI agents must use ArchiMCPServer tools rather than direct REST calls to
      archi-server
  - id: TR-P7
    severity: should
    text: BOM operations must include an idempotencyKey to prevent duplicate writes
  constraints:
  - id: TR-C1
    severity: must
    text: "AI agents must not write directly to ArchiMateModel \u2014 only via archi-server"
  - id: TR-C2
    severity: must
    text: "AI agents must not write to GuardrailCorpus \u2014 archguard is read-only\
      \ for agents"
  - id: TR-C3
    severity: must
    text: checkpointflow gate reviews must not be bypassed or auto-approved by agents
  - id: TR-C4
    severity: must
    text: EAROS evaluation scores must cite evidence excerpts, not impressions
  - id: TR-C5
    severity: must
    text: ArchiMCPServer mutation tools must not be called without prior archi_plan_model_changes
      dry-run
  - id: TR-C6
    severity: must
    text: StrandsCli must not write to ArchiMateModel or GuardrailCorpus
  requirements:
  - id: TR-R1
    severity: must
    text: Model changes via BOM must use idempotencyKey and duplicateStrategy
  - id: TR-R2
    severity: should
    text: All ADM deliverables must be published to Confluence after gate approval
  - id: TR-R3
    severity: should
    text: Capability models must be version-controlled with Git checkpoints
  - id: TR-R4
    severity: may
    text: Architecture views should be auto-laid out after element creation
strategy:
  resources: []
  capabilities:
  - name: ModelWriteCapability
    description: Write elements and relationships to ArchiMate model safely via archi-server
    realizes:
    - TRG1
    served_by: []
  - name: GuardrailQueryCapability
    description: Search and retrieve architectural guardrails via archguard hybrid
      search
    realizes:
    - TRG1
    served_by: []
  - name: WorkflowGovernanceCapability
    description: Execute governed ADM workflows with deterministic resume and gate
      reviews
    realizes:
    - TRG2
    served_by: []
  - name: EvidenceCapability
    description: Evaluate architecture artefacts using EAROS rubrics with cited evidence
    realizes:
    - TRG3
    served_by: []
  - name: CapabilityModelingCapability
    description: Author, render, and version-control business capability models
    realizes:
    - TRG1
    served_by: []
  value_streams:
  - name: ModelingCycle
    description: AI-assisted ArchiMate modelling from intent to committed model change
    stages:
    - Plan
    - DryRun
    - ApplyBOM
    - VerifyModel
    - Publish
    realizes:
    - ModelWriteCapability
  - name: GovernanceCycle
    description: ADM gate review cycle from workflow trigger to human approval
    stages:
    - TriggerGate
    - AwaitEvent
    - HumanReview
    - Approve
    - Resume
    realizes:
    - WorkflowGovernanceCapability
  courses_of_action: []
layers:
- name: Business
  elements:
  - name: EnterpriseArchitectActor
    type: BusinessActor
    description: Human EA author using archi-server, EAROS, and the CLI tools
    plays:
    - EnterpriseArchitect
  - name: AIAgentActor
    type: BusinessActor
    description: Autonomous AI agent (Claude, Copilot) driving modelling tasks
    plays:
    - AIAgent
  - name: EnterpriseArchitect
    type: BusinessRole
    description: Primary human user of the toolset. Authors capability models, conducts
      reviews, approves gate reviews, publishes deliverables.
    assigned_to:
    - ArchiServer
    - JArchiScriptingSystem
    - EAWorkbench
    - ECMStudio
    - EAROS
    - BCMCli
    - ConfpubCli
  - name: AIAgent
    type: BusinessRole
    description: Autonomous AI agent (Claude, Copilot, etc.) driving architecture
      tasks via MCP, CLI, or API.
    assigned_to:
    - ArchiMCPServer
    - ArchicliTool
    - CheckpointFlow
    - StrandsCli
    - ConfpubCli
  - name: ArchitectureBoard
    type: BusinessRole
    description: Governance body that approves gate reviews in checkpointflow await_event
      steps and EAROS major/critical gate decisions.
    assigned_to:
    - CheckpointFlow
    - EAROS
  - name: PlatformTeam
    type: BusinessRole
    description: 'Operates the tooling platform: installs archi-server, maintains
      archguard corpus, configures workflow definitions.'
    assigned_to:
    - ArchiServer
    - Archguard
    - CheckpointFlow
  - name: ModelChangeProcess
    type: BusinessProcess
    description: Plan, dry-run, and apply a BOM batch change to the ArchiMate model
    triggers:
    - ModelChanged
    realizes:
    - ModelWriteService
    assigned_to:
    - EnterpriseArchitect
    - AIAgent
  - name: GateReviewProcess
    type: BusinessProcess
    description: Human reviews and approves a checkpointflow await_event gate
    triggered_by:
    - GateReviewRequested
    realizes:
    - WorkflowService
    assigned_to:
    - ArchitectureBoard
  - name: EvaluationProcess
    type: BusinessProcess
    description: EAROS rubric-based evaluation of an architecture artefact with evidence
    realizes:
    - EvaluationService
    assigned_to:
    - EnterpriseArchitect
  - name: PublishProcess
    type: BusinessProcess
    description: Publish approved ADM deliverables to Confluence after gate sign-off
    triggered_by:
    - WorkflowCompleted
    realizes:
    - PublishService
    assigned_to:
    - AIAgent
  - name: ModelChanged
    type: BusinessEvent
    description: A BOM operation committed a change to the ArchiMate model
    triggers: []
  - name: GateReviewRequested
    type: BusinessEvent
    description: checkpointflow await_event triggered for human review
    triggers:
    - GateReviewProcess
  - name: WorkflowCompleted
    type: BusinessEvent
    description: checkpointflow workflow reached its terminal state
    triggers:
    - PublishProcess
  - name: ReviewCompleted
    type: BusinessEvent
    description: EAROS evaluation finished and record persisted
    triggers: []
  - name: ArtifactPublished
    type: BusinessEvent
    description: Deliverable published to Confluence via confpub-cli
    triggers: []
  - name: ModelWriteService
    type: BusinessService
    description: Safe, idempotent write access to the ArchiMate model via archi-server
    serves: []
  - name: WorkflowService
    type: BusinessService
    description: Deterministic, resumable ADM workflow execution with gate reviews
    serves: []
  - name: EvaluationService
    type: BusinessService
    description: Evidence-based architecture quality assessment using EAROS
    serves: []
  - name: PublishService
    type: BusinessService
    description: Automated publishing of architecture deliverables to Confluence
    serves: []
  - name: ChangeApproval
    type: BusinessObject
    description: Human decision record for a gate review or BOM change
  - name: EvidenceBundle
    type: BusinessObject
    description: Cited excerpt + rubric dimension + score from an EAROS evaluation
- name: Application
  elements:
  - name: ArchiServer
    type: ApplicationComponent
    description: Production-ready HTTP REST API server running inside Archi (jArchi
      plugin). Exposes the ArchiMate model for automation and AI agent integration
      at localhost:8765.
    functions:
    - ModelQuery
    - ElementCRUD
    - RelationshipCRUD
    - ViewManagement
    - BOMApplication
    - ScriptExecution
    - AsyncOperations
    - IdempotentWrites
  - name: ArchiMCPServer
    type: ApplicationComponent
    description: MCP server (archi-mcp) shipping with archi-server. Exposes 28 tools
      (17 read-only + 11 mutation) for direct Claude / AI agent integration via Model
      Context Protocol.
    functions:
    - ModelRead
    - ModelMutation
    - ViewOperations
    - DiagnosticsCheck
    - OperationPolling
  - name: ArchicliTool
    type: ApplicationComponent
    description: TypeScript CLI (archicli) for scripting archi-server. Supports BOM
      batch operations, view export, element search, and async operation polling.
    functions:
    - BOMVerification
    - BatchApply
    - ViewExport
    - ModelStats
    - IDResolution
  - name: JArchiScriptingSystem
    type: ApplicationComponent
    description: Comprehensive jArchi scripting toolkit inside Archi. Provides model
      analysis, ELK auto-layout (5 algorithms), visualisation, CSV import/export,
      and cleanup scripts.
    functions:
    - ModelAnalysis
    - ELKLayout
    - Visualisation
    - CSVExportImport
    - DuplicateDetection
    - RoadmapScaffolding
  - name: Archguard
    type: ApplicationComponent
    description: "CLI + Python library for managing architectural guardrails. Hybrid\
      \ BM25 + semantic search over a JSONL corpus. Guardrail lifecycle: draft \u2192\
      \ active \u2192 deprecated."
    functions:
    - GuardrailStorage
    - HybridSearch
    - LifecycleManagement
    - IntegrityValidation
    - TaxonomyControl
  - name: CheckpointFlow
    type: ApplicationComponent
    description: 'Deterministic resumable workflow engine. Defines workflows as portable
      YAML state machines. await_event provides human-in-the-loop gate reviews (exits
      code 40, resumes via CLI). Agent-agnostic: works with Claude, Copilot, CI, or
      shell.'
    functions:
    - WorkflowExecution
    - StateCheckpointing
    - EventGating
    - ParallelExecution
    - SubWorkflowInvocation
    - ConditionalBranching
  - name: EAROS
    type: ApplicationComponent
    description: 'Evidence-based architecture review framework. Three-layer model:
      Core rubric (9 universal dimensions, 0-4 ordinal scale), artifact-specific Profiles,
      and cross-cutting Overlays. 10 agent skills. Scores require cited evidence,
      not impressions.'
    functions:
    - RubricEvaluation
    - EvidenceCapture
    - GateAssessment
    - ScoringEngine
    - CalibrationCheck
    - ReportGeneration
  - name: BCMCli
    type: ApplicationComponent
    description: Business Capability Modeling CLI. Renders capability trees from JSON/CSV
      into SVG, HTML, PNG, PDF. Used by Phase B agents to produce capability maps.
    functions:
    - CapabilityRendering
    - SVGExport
    - HTMLExport
    - PDFExport
  - name: ConfpubCli
    type: ApplicationComponent
    description: "Agent-friendly Confluence publishing CLI. Markdown \u2192 Confluence\
      \ with diff planning (plan then apply). Used to publish ADM deliverables after\
      \ gate approval."
    functions:
    - DiffPlanning
    - PagePublishing
    - PageManagement
  - name: XlCli
    type: ApplicationComponent
    description: Excel workbook automation CLI. Inspect, query, and mutate Excel workbooks
      programmatically. Useful for Phase F migration planning spreadsheets.
    functions:
    - WorkbookInspection
    - DataQuery
    - WorkbookMutation
  - name: ExcalidrawCli
    type: ApplicationComponent
    description: Excalidraw diagram inspection, validation, and rendering CLI. Used
      for whiteboard-style architecture sketches.
    functions:
    - DiagramInspection
    - DiagramValidation
    - DiagramRendering
  - name: EAWorkbench
    type: ApplicationComponent
    description: Repo-native EA workbench (local browser app). BCM Studio with 7 AI
      actions, Git-native checkpointing, markdown editor. Uses Agent Client Protocol
      with GitHub Copilot.
    functions:
    - CapabilityModeling
    - GitCheckpointing
    - AIAssistance
    - DocumentEditing
    - ScenarioManagement
  - name: ECMStudio
    type: ApplicationComponent
    description: Desktop (Windows) capability tree management. JSONL + Git storage,
      SQLite projection for search. Lifecycle management, import/export, audit events.
    functions:
    - CapabilityTreeEditing
    - GitIntegration
    - LifecycleManagement
    - AuditLogging
    - ModelPublishing
  - name: StrandsCli
    type: ApplicationComponent
    description: 'Multi-agent workflow orchestration (YAML). 7 execution patterns:
      chain, DAG, routing, parallel, evaluator-optimizer, orchestrator-workers, graph.
      Supports Anthropic, Bedrock, OpenAI, Ollama.'
    functions:
    - WorkflowOrchestration
    - AgentChaining
    - ParallelExecution
    - EvaluatorOptimizer
    - OrchestratorWorkers
  - name: ArchiServerRESTInterface
    type: ApplicationInterface
    description: HTTP REST API of archi-server at localhost:8765
    protocol: REST
    serves:
    - ModelWriteService
    part_of: ArchiServer
  - name: ArchiMCPInterface
    type: ApplicationInterface
    description: MCP protocol interface exposing 28 tools to AI agents
    protocol: MCP
    serves:
    - ModelWriteService
    part_of: ArchiMCPServer
  - name: ArchicliInterface
    type: ApplicationInterface
    description: TypeScript CLI for BOM operations and model stats
    protocol: CLI
    serves:
    - ModelWriteService
    part_of: ArchicliTool
  - name: ArchguardCLI
    type: ApplicationInterface
    description: Python CLI for guardrail management and search
    protocol: CLI
    serves:
    - GuardrailQueryCapability
    part_of: Archguard
  - name: CheckpointflowCLI
    type: ApplicationInterface
    description: CLI to start, resume, and inspect workflow executions
    protocol: CLI
    serves:
    - WorkflowService
    part_of: CheckpointFlow
  - name: StrandsCLIInterface
    type: ApplicationInterface
    description: YAML-driven multi-agent orchestration CLI
    protocol: CLI
    serves:
    - WorkflowService
    part_of: StrandsCli
  - name: BOMWorkflow
    type: ApplicationProcess
    description: "Plan \u2192 Dry-run \u2192 Verify \u2192 Apply BOM to ArchiMate\
      \ model"
    steps:
    - plan_changes
    - dry_run
    - verify_result
    - apply_bom
    realizes:
    - BOMApplyService
  - name: EAROSWorkflow
    type: ApplicationProcess
    description: "Load rubric \u2192 Collect evidence \u2192 Score \u2192 Generate\
      \ report"
    steps:
    - load_rubric
    - collect_evidence
    - score_dimensions
    - calibrate
    - generate_report
    realizes:
    - RubricEvaluationService
  - name: ModelQueryService
    type: ApplicationService
    description: Read-only query of ArchiMate model elements, relations, and views
    serves:
    - ModelChangeProcess
    realized_by:
    - ArchiServer
    - ArchiMCPServer
  - name: BOMApplyService
    type: ApplicationService
    description: Idempotent batch BOM application to the ArchiMate model
    serves:
    - ModelChangeProcess
    realized_by:
    - ArchiServer
  - name: GuardrailSearchService
    type: ApplicationService
    description: Hybrid BM25 + semantic search over the guardrail corpus
    serves:
    - ModelChangeProcess
    - EvaluationProcess
    realized_by:
    - Archguard
  - name: WorkflowExecutionService
    type: ApplicationService
    description: Deterministic workflow execution with checkpointed state
    serves:
    - GateReviewProcess
    realized_by:
    - CheckpointFlow
  - name: RubricEvaluationService
    type: ApplicationService
    description: EAROS evidence-based scoring of architecture artefacts
    serves:
    - EvaluationProcess
    realized_by:
    - EAROS
  - name: ArchiMateModel
    type: DataObject
    description: The live .archimate model file managed by Archi. Single source of
      truth for enterprise architecture.
  - name: GuardrailCorpus
    type: DataObject
    description: "archguard JSONL store \u2014 architectural constraints with hybrid\
      \ BM25 + semantic search index."
  - name: BOMFile
    type: DataObject
    description: Bill of Materials JSON for archi-server batch operations. Uses tempId
      for friendly element references.
  - name: WorkflowDefinition
    type: DataObject
    description: checkpointflow YAML state machine defining steps, transitions, gate
      reviews, and parallel branches.
  - name: WorkflowState
    type: DataObject
    description: checkpointflow persisted execution state in ~/.checkpointflow/. Enables
      deterministic resume after agent failure or gate pause.
  - name: ArchitectureRubric
    type: DataObject
    description: "EAROS rubric YAML \u2014 9 evaluation dimensions with 0-4 ordinal\
      \ scale, evidence requirements, and gate types."
  - name: EvaluationRecord
    type: DataObject
    description: "EAROS evaluation output \u2014 scores, evidence citations, gate\
      \ pass/fail, calibration status. Conforms to evaluation.schema.json."
  - name: CapabilityModel
    type: DataObject
    description: Business capability tree in JSONL format (bcm-cli / ECMStudio). Version-controlled
      in Git.
  - name: CapabilityMap
    type: DataObject
    description: "Rendered capability map \u2014 SVG, HTML, PNG, or PDF output from\
      \ BCMCli."
  - name: ArchitectureArtifact
    type: DataObject
    description: ADM deliverable (Architecture Vision, Gap Analysis, etc.) in Markdown
      format, ready for EAROS review or Confluence publishing.
  - name: ArchitectureDocument
    type: DataObject
    description: Markdown architecture document managed in EA Workbench.
  - name: ConfluencePage
    type: DataObject
    description: "Published Confluence page \u2014 output of ConfpubCli."
  - name: ExcelWorkbook
    type: DataObject
    description: Excel workbook for migration planning, capacity planning, or stakeholder
      registers.
  - name: ExcalidrawDiagram
    type: DataObject
    description: Whiteboard-style architecture diagram (Excalidraw JSON format).
  - name: WorkflowOutput
    type: DataObject
    description: Output artifacts produced by StrandsCli workflow execution.
- name: Technology
  elements:
  - name: LocalDeveloperMachine
    type: Node
    description: Developer workstation running Archi, archi-server, and all Python
      tools
    hosts:
    - ArchiJVM
    - Python3Runtime
    - SQLiteDB
    - NodeJSRuntime
  - name: GitRepository
    type: Node
    description: Remote Git repository hosting ArchiMate model, capability models,
      and workflows
  - name: ArchiJVM
    type: SystemSoftware
    description: Java Virtual Machine running Archi with jArchi plugin
    part_of: LocalDeveloperMachine
    serves:
    - ArchiServer
    - JArchiScriptingSystem
  - name: Python3Runtime
    type: SystemSoftware
    description: Python 3.11+ runtime for archguard, EAROS, checkpointflow, strands-cli
    part_of: LocalDeveloperMachine
    serves:
    - Archguard
    - CheckpointFlow
    - EAROS
    - StrandsCli
  - name: SQLiteDB
    type: SystemSoftware
    description: SQLite database backing archguard's FTS5 guardrail search index
    part_of: LocalDeveloperMachine
    serves:
    - Archguard
  - name: NodeJSRuntime
    type: SystemSoftware
    description: Node.js runtime for archicli TypeScript CLI
    part_of: LocalDeveloperMachine
    serves:
    - ArchicliTool
  - name: LocalhostHTTP8765
    type: TechnologyInterface
    description: HTTP interface serving archi-server REST API
    protocol: HTTP
    port: 8765
    serves:
    - ModelQueryService
    - BOMApplyService
    part_of: LocalDeveloperMachine
  - name: GitVersionControlService
    type: TechnologyService
    description: Git-based version control for ArchiMate model and capability models
    serves:
    - EAWorkbench
    - ECMStudio
    realized_by:
    - GitRepository
  - name: LocalFileSystemService
    type: TechnologyService
    description: File system storage for workflow state, YAML definitions, JSONL corpus
    serves:
    - CheckpointFlow
    - Archguard
    - StrandsCli
    realized_by:
    - LocalDeveloperMachine
  - name: ArchimateFile
    type: Artifact
    description: The .archimate model file managed by Archi
    artifact_type: file
  - name: GuardrailJSONL
    type: Artifact
    description: archguard guardrail corpus (JSONL)
    artifact_type: json
  - name: WorkflowStateFiles
    type: Artifact
    description: checkpointflow persisted state in ~/.checkpointflow/
    artifact_type: file
  - name: BOMJSONFile
    type: Artifact
    description: Bill of Materials JSON for archi-server batch
    artifact_type: json
  - name: EvaluationJSONFile
    type: Artifact
    description: EAROS evaluation record (evaluation.schema.json)
    artifact_type: json
  - name: CapabilityModelJSONL
    type: Artifact
    description: Business capability tree (JSONL, BCM format)
    artifact_type: json
  - name: WorkflowDefinitionYAML
    type: Artifact
    description: checkpointflow / strands-cli workflow YAML
    artifact_type: yaml
  - name: LocalLoopback
    type: CommunicationNetwork
    description: localhost network connecting CLI tools to archi-server
    connects:
    - LocalDeveloperMachine
- name: Implementation
  elements:
  - name: ModelingCycleWorkPackage
    type: WorkPackage
    description: "Plan \u2192 DryRun \u2192 Apply BOM \u2192 Verify \u2192 Publish\
      \ cycle"
    realizes:
    - ArchiServerBOM
  - name: EvaluationWorkPackage
    type: WorkPackage
    description: EAROS rubric evaluation cycle for an architecture artefact
    realizes:
    - EAROSEvaluationRecord
  - name: ArchiServerBOM
    type: Deliverable
    description: Approved BOM file for a model change batch operation
  - name: EAROSEvaluationRecord
    type: Deliverable
    description: Completed EAROS evaluation with evidence citations and gate verdict
  - name: PublishedDocumentSet
    type: Deliverable
    description: Set of ADM deliverables published to Confluence after gate approval
  - name: ManualModelingPlateau
    type: Plateau
    description: "Architect manually edits the .archimate file \u2014 no automation,\
      \ no governance"
  - name: AssistedModelingPlateau
    type: Plateau
    description: AI agents write to model via archi-server with BOM and idempotency
    realized_by:
    - ModelWriteCapability
  - name: GovernedModelingPlateau
    type: Plateau
    description: 'Full governance: archi-server writes + checkpointflow gates + EAROS
      evaluation'
    realized_by:
    - ModelWriteCapability
    - WorkflowGovernanceCapability
    - EvidenceCapability
  - name: AutomationGap
    type: Gap
    description: Delta between manual modelling and AI-assisted modelling via archi-server
    from_plateau: ManualModelingPlateau
    to_plateau: AssistedModelingPlateau
  - name: GovernanceGap
    type: Gap
    description: Delta between AI-assisted modelling and fully governed modelling
      with gates
    from_plateau: AssistedModelingPlateau
    to_plateau: GovernedModelingPlateau
relationships:
- from: ModelWriteCapability
  to: TRG1
  type: Realization
- from: WorkflowGovernanceCapability
  to: TRG2
  type: Realization
- from: EvidenceCapability
  to: TRG3
  type: Realization
- from: TRD1
  to: TRG1
  type: Influence
  influence: +
- from: TRD3
  to: TRG2
  type: Influence
  influence: +
- from: ArchiServer
  to: ModelQueryService
  type: Realization
- from: ArchiServer
  to: BOMApplyService
  type: Realization
- from: ArchiMCPServer
  to: ModelQueryService
  type: Realization
- from: Archguard
  to: GuardrailSearchService
  type: Realization
- from: CheckpointFlow
  to: WorkflowExecutionService
  type: Realization
- from: EAROS
  to: RubricEvaluationService
  type: Realization
- from: ArchiJVM
  to: ArchiServer
  type: Serving
- from: Python3Runtime
  to: Archguard
  type: Serving
- from: Python3Runtime
  to: CheckpointFlow
  type: Serving
- from: Python3Runtime
  to: EAROS
