meta:
  name: bootstrap-model
  version: '2.0'
  archimate: '3.2'
  description: Self-describing ArchiMate model
  generated_by: ModelBootstrapper
  note: "Generated \u2014 do not edit manually"
motivation:
  stakeholders:
  - name: SponsorOrganisation
    description: Business unit initiating the ADM cycle
    concerns:
    - Strategic alignment
    - Delivery timelines
    - ROI
    influences:
    - TD1
  - name: ArchitectureBoard
    description: Governance body approving phase-gate transitions
    concerns:
    - Policy compliance
    - Risk management
    - Traceability
    influences: []
  - name: BusinessStakeholders
    description: End users and business owners of architecture deliverables
    concerns:
    - Fitness for purpose
    - Stakeholder sign-off
    - Change impact
    influences: []
  drivers:
  - id: TD1
    name: Business transformation
    description: Organisations undergoing strategic change require systematic architecture
      governance
    category: external
    associated_to:
    - SponsorOrganisation
  - id: TD2
    name: Digital complexity
    description: Growing technical landscape makes ad-hoc architecture decisions unsustainable
    category: internal
    associated_to:
    - ArchitectureBoard
  - id: TD3
    name: Regulatory compliance
    description: Regulated industries require documented, traceable architecture decisions
    category: external
    associated_to:
    - ArchitectureBoard
  assessments:
  - id: TA1
    name: Architecture inconsistency risk
    description: Uncoordinated phase agents produce conflicting deliverables
    type: risk
    associated_to:
    - TD2
  - id: TA2
    name: Phase gate bypass risk
    description: Agents transitioning phases without Architecture Board approval
    type: risk
    associated_to:
    - TD1
  - id: TA3
    name: Baseline gap risk
    description: Target architecture defined without establishing baseline first
    type: risk
    associated_to:
    - TD2
  - id: TA4
    name: Traceability opportunity
    description: Boucle 0 can automate traceability from requirements to policy rules
    type: opportunity
    associated_to:
    - TD1
  goals:
  - id: TG1
    name: ArchitectureAlignment
    description: All architecture decisions are traceable to business strategy and
      drivers
    realized_by:
    - TP2
    - EnterpriseArchitectureCapability
  - id: TG2
    name: PhasedDelivery
    description: Each ADM phase produces complete, approved deliverables before the
      next begins
    realized_by:
    - TP1
    - TP4
    - ArchitectureGovernanceCapability
  - id: TG3
    name: ContinuousRequirements
    description: Architecture requirements are continuously managed and traceable
      across all phases
    realized_by:
    - TP5
    - RequirementsManagementCapability
  outcomes: []
  values: []
  meanings: []
  principles:
  - id: TP1
    severity: must
    text: Each ADM phase must produce approved deliverables before triggering the
      next phase
  - id: TP2
    severity: must
    text: All architecture decisions must be traceable to a business driver or goal
  - id: TP3
    severity: should
    text: Reuse existing architecture assets before creating new ones
  - id: TP4
    severity: must
    text: Architecture Board is the sole authority for phase-gate approvals
  - id: TP5
    severity: must
    text: Requirements management is continuous and spans all ADM phases
  - id: TP6
    severity: must
    text: Baseline architecture must exist before target architecture is defined
  - id: TP7
    severity: should
    text: Architecture deliverables must be version-controlled in the Architecture
      Repository
  constraints:
  - id: TC1
    severity: must
    text: No agent may directly overwrite another agent's approved output artifact
  - id: TC2
    severity: must
    text: Phase transitions require explicit Architecture Board approval
  - id: TC3
    severity: must
    text: Gap analysis is mandatory for each architecture domain (B, C1, C2, D)
  - id: TC4
    severity: must
    text: PhaseHAgent must not overwrite the approved ArchitectureDefinitionDocument
  - id: TC5
    severity: must
    text: RequirementsManagementAgent must not write to ArchitectureContract or ArchitectureDefinitionDocument
  requirements:
  - id: TR1
    severity: must
    text: Stakeholder sign-off required at Architecture Vision gate (Phase A)
  - id: TR2
    severity: should
    text: All architecture changes must reference an approved ChangeRequest
  - id: TR3
    severity: should
    text: Phase agents should produce a compliance assessment at each gate
  - id: TR4
    severity: may
    text: ADM cycle duration and phase scope may be tailored to project scale
strategy:
  resources: []
  capabilities:
  - name: EnterpriseArchitectureCapability
    description: Develop and maintain enterprise architecture systematically across
      all domains
    realizes:
    - TG1
    served_by: []
  - name: ArchitectureGovernanceCapability
    description: Enforce architecture decisions and gate reviews via Architecture
      Board
    realizes:
    - TG2
    served_by: []
  - name: RequirementsManagementCapability
    description: Maintain traceable architecture requirements continuously across
      ADM phases
    realizes:
    - TG3
    served_by: []
  - name: GapAnalysisCapability
    description: Identify and document deltas between baseline and target architecture
    realizes:
    - TG1
    served_by: []
  value_streams:
  - name: ADMLifecycle
    description: End-to-end TOGAF ADM cycle delivering a target enterprise architecture
    stages:
    - Preliminary
    - PhaseA
    - PhaseB
    - PhaseC1
    - PhaseC2
    - PhaseD
    - PhaseE
    - PhaseF
    - PhaseG
    - PhaseH
    realizes:
    - EnterpriseArchitectureCapability
    - ArchitectureGovernanceCapability
  courses_of_action:
  - name: IterativeADM
    description: Apply ADM cycle iteratively, tailoring scope and depth per project
    realizes:
    - EnterpriseArchitectureCapability
  - name: ContinuousGovernance
    description: Maintain Architecture Board oversight across all phases and transitions
    realizes:
    - ArchitectureGovernanceCapability
layers:
- name: Business
  elements:
  - name: EnterpriseArchitecturePractice
    type: BusinessActor
    description: The EA team running the ADM cycle and governing phase transitions
    plays:
    - ChiefArchitect
    - BusinessArchitect
    - DataArchitect
    - ApplicationArchitect
    - TechnologyArchitect
    - SolutionArchitect
  - name: SponsorOrganisationActor
    type: BusinessActor
    description: Business unit sponsoring the architecture engagement
    plays:
    - Stakeholder
  - name: ArchitectureBoard
    type: BusinessRole
    description: 'Governance body: approves phase-gate transitions, issues architecture
      mandates, arbitrates disputes'
    assigned_to:
    - PhaseAAgent
    - PhaseBAgent
    - PhaseC1Agent
    - PhaseC2Agent
    - PhaseDAgent
    - PhaseEAgent
    - PhaseFAgent
    - PhaseGAgent
    - PhaseHAgent
    - PreliminaryPhaseAgent
  - name: ChiefArchitect
    type: BusinessRole
    description: Leads the architecture practice, sponsors ADM cycles, signs the Statement
      of Architecture Work
    assigned_to:
    - PhaseAAgent
    - PreliminaryPhaseAgent
  - name: BusinessArchitect
    type: BusinessRole
    description: Domain expert for Phase B; defines business capabilities and value
      streams
    assigned_to:
    - PhaseBAgent
  - name: DataArchitect
    type: BusinessRole
    description: Domain expert for Phase C1; owns data models and data governance
    assigned_to:
    - PhaseC1Agent
  - name: ApplicationArchitect
    type: BusinessRole
    description: Domain expert for Phase C2; designs application landscape and integrations
    assigned_to:
    - PhaseC2Agent
  - name: TechnologyArchitect
    type: BusinessRole
    description: Domain expert for Phase D; defines infrastructure and platform standards
    assigned_to:
    - PhaseDAgent
  - name: SolutionArchitect
    type: BusinessRole
    description: "Leads Phases E\u2013F; translates architecture into implementable\
      \ solutions"
    assigned_to:
    - PhaseEAgent
    - PhaseFAgent
  - name: Stakeholder
    type: BusinessRole
    description: Any party with an interest in architecture outcomes; consulted at
      gates
    assigned_to:
    - PhaseAAgent
  - name: PreliminaryProcess
    type: BusinessProcess
    description: Tailor the TOGAF framework, establish Architecture Repository and
      principles
    triggers:
    - ArchitectureVisionApproved
    realizes:
    - ArchitectureService
    assigned_to:
    - ChiefArchitect
  - name: ArchitectureVisionProcess
    type: BusinessProcess
    description: Define scope, identify stakeholders, obtain approval to proceed
    triggered_by:
    - PreliminaryCompleted
    triggers:
    - ArchitectureVisionApproved
    realizes:
    - ArchitectureService
    assigned_to:
    - ChiefArchitect
    - Stakeholder
  - name: BusinessArchitectureProcess
    type: BusinessProcess
    description: Develop baseline and target Business Architecture with gap analysis
    triggered_by:
    - ArchitectureVisionApproved
    triggers:
    - BusinessArchitectureApproved
    realizes:
    - ArchitectureService
    assigned_to:
    - BusinessArchitect
  - name: DataArchitectureProcess
    type: BusinessProcess
    description: Develop baseline and target Data Architecture
    triggered_by:
    - BusinessArchitectureApproved
    triggers:
    - DataArchitectureApproved
    realizes:
    - ArchitectureService
    assigned_to:
    - DataArchitect
  - name: ApplicationArchitectureProcess
    type: BusinessProcess
    description: Develop baseline and target Application Architecture
    triggered_by:
    - BusinessArchitectureApproved
    triggers:
    - ApplicationArchitectureApproved
    realizes:
    - ArchitectureService
    assigned_to:
    - ApplicationArchitect
  - name: TechnologyArchitectureProcess
    type: BusinessProcess
    description: Develop baseline and target Technology Architecture
    triggered_by:
    - DataArchitectureApproved
    - ApplicationArchitectureApproved
    triggers:
    - TechnologyArchitectureApproved
    realizes:
    - ArchitectureService
    assigned_to:
    - TechnologyArchitect
  - name: ImplementationGovernanceProcess
    type: BusinessProcess
    description: Oversee implementation, issue Architecture Contracts, assess compliance
    triggered_by:
    - MigrationPlanApproved
    triggers:
    - ImplementationCompleted
    realizes:
    - GovernanceService
    assigned_to:
    - ArchitectureBoard
  - name: ChangeManagementProcess
    type: BusinessProcess
    description: Monitor architecture, evaluate change requests, initiate new ADM
      cycles
    triggered_by:
    - ImplementationCompleted
    realizes:
    - GovernanceService
    assigned_to:
    - ArchitectureBoard
  - name: PreliminaryCompleted
    type: BusinessEvent
    description: Preliminary phase deliverables approved
    triggers: []
  - name: GateReviewRequested
    type: BusinessEvent
    description: An ADM agent requests Architecture Board review
    triggers: []
  - name: ChangeRequestReceived
    type: BusinessEvent
    description: External change request submitted to PhaseH
    triggers:
    - ChangeManagementProcess
  - name: ArchitectureService
    type: BusinessService
    description: Develops enterprise architecture deliverables across all four domains
    serves: []
  - name: GovernanceService
    type: BusinessService
    description: Enforces architecture decisions, approves gates, issues contracts
    serves: []
  - name: RequirementsService
    type: BusinessService
    description: Maintains traceable requirements continuously across all ADM phases
    serves: []
  - name: ComplianceService
    type: BusinessService
    description: Evaluates implementation projects against approved architecture
    serves: []
  - name: ArchitectureMandate
    type: BusinessObject
    description: Formal organisational commitment to the EA programme
  - name: ComplianceEvidence
    type: BusinessObject
    description: Documentation demonstrating implementation alignment with architecture
  - name: StatementOfArchitectureWork
    type: Contract
    description: "Signed agreement defining scope, schedule, and acceptance criteria\
      \ \u2014 Phase A gate"
  - name: ArchitectureContractAgreement
    type: Contract
    description: "Agreement between development teams and architecture on deliverables\
      \ \u2014 Phase G"
- name: Application
  elements:
  - name: PreliminaryPhaseAgent
    type: ApplicationComponent
    description: 'Prepares the organisation: tailors the framework, defines principles,
      establishes the Architecture Repository'
    functions:
    - FrameworkTailoring
    - PrinciplesDefinition
    - RepositorySetup
    - OrganisationalAlignment
    gate_review: ArchitectureBoard
  - name: PhaseAAgent
    type: ApplicationComponent
    description: "Architecture Vision \u2014 defines scope, identifies stakeholders,\
      \ obtains approval to proceed"
    functions:
    - StakeholderAnalysis
    - ArchitectureVisionDraft
    - ScopeDefinition
    - ConstraintIdentification
    gate_review: ArchitectureBoard
  - name: PhaseBAgent
    type: ApplicationComponent
    description: "Business Architecture \u2014 develops baseline and target Business\
      \ Architecture, identifies gaps"
    functions:
    - BaselineBusinessCapture
    - TargetBusinessDefinition
    - BusinessGapAnalysis
    - BusinessRequirementsCapture
    gate_review: ArchitectureBoard
  - name: PhaseC1Agent
    type: ApplicationComponent
    description: "Data Architecture \u2014 develops baseline and target Data Architecture,\
      \ aligns with Business Architecture"
    functions:
    - BaselineDataCapture
    - TargetDataDefinition
    - DataGapAnalysis
    - DataEntityModeling
    gate_review: ArchitectureBoard
  - name: PhaseC2Agent
    type: ApplicationComponent
    description: "Application Architecture \u2014 develops baseline and target Application\
      \ Architecture, aligns with Business and Data Architecture"
    functions:
    - BaselineApplicationCapture
    - TargetApplicationDefinition
    - ApplicationGapAnalysis
    - ApplicationInteractionModeling
    gate_review: ArchitectureBoard
  - name: PhaseDAgent
    type: ApplicationComponent
    description: "Technology Architecture \u2014 develops baseline and target Technology\
      \ Architecture, consolidates the Architecture Definition Document"
    functions:
    - BaselineTechnologyCapture
    - TargetTechnologyDefinition
    - TechnologyGapAnalysis
    - ArchitectureDefinitionConsolidation
    gate_review: ArchitectureBoard
  - name: PhaseEAgent
    type: ApplicationComponent
    description: "Opportunities and Solutions \u2014 generates implementation roadmap,\
      \ identifies Transition Architectures"
    functions:
    - WorkPackageDefinition
    - TransitionArchitectureDefinition
    - ImplementationFactorAssessment
    - RoadmapDraft
    gate_review: ArchitectureBoard
  - name: PhaseFAgent
    type: ApplicationComponent
    description: "Migration Planning \u2014 finalises the roadmap, produces the Implementation\
      \ and Migration Plan"
    functions:
    - MigrationPlanningAssessment
    - RoadmapFinalization
    - ImplementationMigrationPlanDraft
    - CostBenefitAnalysis
    gate_review: ArchitectureBoard
  - name: PhaseGAgent
    type: ApplicationComponent
    description: "Implementation Governance \u2014 provides architectural oversight,\
      \ issues Architecture Contracts, assesses compliance"
    functions:
    - ImplementationOversight
    - ArchitectureContractIssuance
    - ComplianceAssessment
    - ChangeRequestEvaluation
    gate_review: ArchitectureBoard
  - name: PhaseHAgent
    type: ApplicationComponent
    description: "Architecture Change Management \u2014 monitors architecture, evaluates\
      \ change requests, initiates new ADM cycle when needed"
    functions:
    - ChangeMonitoring
    - ChangeRequestAssessment
    - ArchitectureBaselineUpdate
    - NewCycleTriggering
    gate_review: ArchitectureBoard
  - name: RequirementsManagementAgent
    type: ApplicationComponent
    description: "Central continuous agent \u2014 manages architecture requirements\
      \ across all ADM phases, maintains traceability to business drivers"
    functions:
    - RequirementsCapture
    - RequirementsTraceability
    - ImpactAssessment
    - RequirementsVersioning
  - name: ADMEventBus
    type: ApplicationInterface
    description: Event-driven interface for phase-gate notifications between agents
    protocol: Event
    serves:
    - PhaseGateTriggerService
  - name: ArchitectureRepositoryInterface
    type: ApplicationInterface
    description: Read/write interface to the Architecture Repository data store
    protocol: REST
    serves:
    - ModelQueryService
  - name: PhaseGateTriggerService
    type: ApplicationService
    description: Manages phase-gate event routing and Architecture Board notification
    serves:
    - ImplementationGovernanceProcess
    - ChangeManagementProcess
  - name: ModelQueryService
    type: ApplicationService
    description: Read-only query service for Architecture Repository content
    serves:
    - BusinessArchitectureProcess
    - DataArchitectureProcess
    - ApplicationArchitectureProcess
    - TechnologyArchitectureProcess
  - name: RequirementsTracingService
    type: ApplicationService
    description: Links requirements to architecture decisions and business drivers
    serves:
    - RequirementsService
    realized_by:
    - RequirementsManagementAgent
  - name: ComplianceAssessmentService
    type: ApplicationService
    description: Evaluates implementation artefacts against approved architecture
    serves:
    - ComplianceService
    realized_by:
    - PhaseGAgent
  - name: RequestForArchitectureWork
    type: DataObject
    description: Formal request triggering a new ADM cycle (from sponsor)
  - name: ArchitecturePrinciples
    type: DataObject
    description: Enduring rules that guide architecture decisions across the enterprise
  - name: TailoredArchitectureFramework
    type: DataObject
    description: Organisation-specific adaptation of the TOGAF ADM
  - name: ArchitectureRepository
    type: DataObject
    description: Versioned store for all architecture deliverables and assets
  - name: OrganisationalContext
    type: DataObject
    description: 'Current state: org structure, capabilities, constraints'
  - name: ExistingFrameworks
    type: DataObject
    description: Incumbent architecture frameworks in use
  - name: BusinessStrategy
    type: DataObject
    description: Enterprise strategic intent, goals, and drivers
  - name: ArchitectureVision
    type: DataObject
    description: High-level aspirational description of target architecture
  - name: StatementOfArchitectureWork
    type: DataObject
    description: Agreed scope, schedule, and acceptance criteria for the work
  - name: BusinessArchitectureDocument
    type: DataObject
    description: Baseline and target Business Architecture with gap analysis
  - name: DataArchitectureDocument
    type: DataObject
    description: Baseline and target Data Architecture with gap analysis
  - name: ApplicationArchitectureDocument
    type: DataObject
    description: Baseline and target Application Architecture with gap analysis
  - name: TechnologyArchitectureDocument
    type: DataObject
    description: Baseline and target Technology Architecture with gap analysis
  - name: ArchitectureDefinitionDocument
    type: DataObject
    description: Consolidated architecture across all four domains
  - name: ArchitectureRequirementsSpec
    type: DataObject
    description: Quantitative statements of requirements that architecture must satisfy
  - name: GapAnalysis
    type: DataObject
    description: Delta between baseline and target for a given architecture domain
  - name: ArchitectureRoadmap
    type: DataObject
    description: Prioritised list of work packages toward target architecture
  - name: TransitionArchitecture
    type: DataObject
    description: Intermediate architecture plateau between baseline and target
  - name: ImplementationFactorAssessment
    type: DataObject
    description: Risks, constraints, and assumptions affecting implementation
  - name: ImplementationMigrationPlan
    type: DataObject
    description: Detailed plan for implementing the architecture roadmap
  - name: ArchitectureContract
    type: DataObject
    description: Agreement between sponsor and architecture team on deliverables
  - name: ArchitectureComplianceAssessment
    type: DataObject
    description: Evaluation of implementation projects against architecture
  - name: ArchitectureBaseline
    type: DataObject
    description: Approved current-state architecture snapshot
  - name: ChangeRequest
    type: DataObject
    description: Formal request to modify the approved architecture
  - name: ChangeRequestAssessment
    type: DataObject
    description: 'Evaluation of a change request: impact, recommendation'
  - name: ImplementationStatus
    type: DataObject
    description: Progress reports from implementation projects
- name: Technology
  elements:
  - name: ArchitectureRepositoryNode
    type: Node
    description: Centralised server hosting all versioned architecture deliverables
    hosts:
    - VersionControlService
    - RepositoryDatabase
  - name: ADMWorkstation
    type: Node
    description: Workstation used by architects to author and review deliverables
    hosts:
    - ADMToolSuite
  - name: VersionControlService
    type: SystemSoftware
    description: Git-based version control for all architecture artefacts
    part_of: ArchitectureRepositoryNode
    serves:
    - RequirementsManagementAgent
    - PhaseDAgent
  - name: RepositoryDatabase
    type: SystemSoftware
    description: Structured database indexing architecture repository content
    part_of: ArchitectureRepositoryNode
  - name: ADMToolSuite
    type: SystemSoftware
    description: Modelling and documentation tool suite (Archi, Confluence, Word)
    part_of: ADMWorkstation
    serves:
    - PreliminaryPhaseAgent
    - PhaseAAgent
  - name: RepositoryHTTPS
    type: TechnologyInterface
    description: HTTPS interface to Architecture Repository for read/write access
    protocol: HTTPS
    port: 443
    serves:
    - ModelQueryService
    part_of: ArchitectureRepositoryNode
  - name: ArchitectureDefinitionDocument
    type: Deliverable
    description: Formal deliverable covering all architecture domains
  - name: ImplementationMigrationPlan
    type: Deliverable
    description: Formal plan for executing the architecture transition
  - name: ArchitectureContract
    type: Deliverable
    description: Governance agreement between sponsor and architects
  - name: StatementOfArchitectureWork
    type: Deliverable
    description: "Scope and acceptance criteria \u2014 signed off at Phase A gate"
  - name: BaselineArchitecture
    type: Plateau
    description: Stable, approved current-state architecture
  - name: TransitionArchitecture
    type: Plateau
    description: Intermediate stable state on the way to target
  - name: TargetArchitecture
    type: Plateau
    description: Desired future-state architecture
  - name: ArchitectureRoadmapFinal
    type: WorkPackage
    description: Prioritised and approved implementation roadmap
- name: Implementation
  elements:
  - name: ArchitectureRoadmapFinalPackage
    type: WorkPackage
    description: Prioritised and approved implementation roadmap work package
    realizes:
    - ImplementationMigrationPlanDeliverable
  - name: ArchitectureDefinitionDocumentDeliverable
    type: Deliverable
    description: "Formal deliverable covering all four architecture domains \u2014\
      \ Phase D output"
  - name: ImplementationMigrationPlanDeliverable
    type: Deliverable
    description: "Formal plan for executing the architecture transition \u2014 Phase\
      \ F output"
  - name: ArchitectureContractDeliverable
    type: Deliverable
    description: "Governance agreement between sponsor and architects \u2014 Phase\
      \ G output"
  - name: StatementOfArchitectureWorkDeliverable
    type: Deliverable
    description: "Scope and acceptance criteria \u2014 signed off at Phase A gate"
  - name: BaselineArchitecturePlateau
    type: Plateau
    description: Approved current-state architecture across all four domains
    realized_by:
    - EnterpriseArchitectureCapability
  - name: TransitionArchitecturePlateau
    type: Plateau
    description: "Intermediate stable architecture state \u2014 one or more transition\
      \ points"
    realized_by:
    - EnterpriseArchitectureCapability
  - name: TargetArchitecturePlateau
    type: Plateau
    description: "Desired future-state architecture \u2014 fully aligned with business\
      \ strategy"
    realized_by:
    - EnterpriseArchitectureCapability
  - name: BusinessArchitectureGap
    type: Gap
    description: Delta between baseline and target Business Architecture (Phase B)
    from_plateau: BaselineArchitecturePlateau
    to_plateau: TargetArchitecturePlateau
  - name: DataArchitectureGap
    type: Gap
    description: Delta between baseline and target Data Architecture (Phase C1)
    from_plateau: BaselineArchitecturePlateau
    to_plateau: TargetArchitecturePlateau
  - name: ApplicationArchitectureGap
    type: Gap
    description: Delta between baseline and target Application Architecture (Phase
      C2)
    from_plateau: BaselineArchitecturePlateau
    to_plateau: TargetArchitecturePlateau
  - name: TechnologyArchitectureGap
    type: Gap
    description: Delta between baseline and target Technology Architecture (Phase
      D)
    from_plateau: BaselineArchitecturePlateau
    to_plateau: TargetArchitecturePlateau
