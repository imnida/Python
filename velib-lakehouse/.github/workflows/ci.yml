name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:

  # ---------------------------------------------------------------------------
  # Lint & tests (ubuntu x86, rapide)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Check uv.lock is up to date
        run: uv lock --check

  # ---------------------------------------------------------------------------
  # Build images ARM64 → GHCR (uniquement sur push main)
  # ---------------------------------------------------------------------------
  build-arm64:
    name: Build & Push ARM64 images
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (émulation ARM64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image Dagster (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dagster/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_BASE }}/dagster:latest
          cache-from: type=gha,scope=dagster
          cache-to: type=gha,mode=max,scope=dagster

      - name: Build & push image API (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_BASE }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ---------------------------------------------------------------------------
  # Deploy sur Raspberry Pi via SSH
  # Secrets requis: RPI_HOST, RPI_USER, RPI_SSH_KEY, RPI_PROJECT_PATH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Raspberry Pi
    runs-on: ubuntu-latest
    needs: build-arm64
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.RPI_PROJECT_PATH }}
            git pull origin main
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.rpi.yaml pull velib-lakehouse dagster-webserver dagster-daemon velib-api
            docker compose -f docker-compose.rpi.yaml up -d --remove-orphans
            docker image prune -f
